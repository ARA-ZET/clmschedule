  <!-- ── App update notification ────────────────────────────────────────────
       Periodically fetches flutter_service_worker.js (cache-busted) and
       compares its CACHE_NAME hash to the one present on page load.
       When a new build is detected a banner prompts the user to refresh.
  ──────────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      var _initialHash = null;
      var _bannerShown = false;
      var POLL_INTERVAL_MS = 5 * 60 * 1000; // 5 minutes

      function extractHash(text) {
        // Flutter service worker contains: const CACHE_NAME = 'flutter-app-cache-<hash>';
        var m = text.match(/const\s+CACHE_NAME\s*=\s*['"]([^'"]+)['"]/);
        if (m) return m[1];
        // Fallback: hash the whole text length + first 200 chars as fingerprint
        return text.length + '|' + text.slice(0, 200);
      }

      function showUpdateBanner() {
        if (_bannerShown) return;
        _bannerShown = true;

        var banner = document.createElement('div');
        banner.id = 'app-update-banner';
        banner.innerHTML =
          '<span style="flex:1">&#x1F504; A new version of this app is available.</span>' +
          '<button id="app-update-btn" style="' +
            'background:#D4A017;color:#fff;border:none;border-radius:6px;' +
            'padding:8px 18px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap' +
          '">Update now</button>' +
          '<button id="app-update-dismiss" style="' +
            'background:transparent;color:rgba(255,255,255,0.7);border:none;' +
            'cursor:pointer;font-size:18px;padding:0 4px;line-height:1' +
          '">&times;</button>';

        Object.assign(banner.style, {
          position: 'fixed',
          bottom: '20px',
          left: '50%',
          transform: 'translateX(-50%)',
          zIndex: '999999',
          background: '#0A2E6E',
          color: '#fff',
          padding: '12px 16px',
          borderRadius: '10px',
          display: 'flex',
          alignItems: 'center',
          gap: '12px',
          boxShadow: '0 4px 20px rgba(0,0,0,0.4)',
          fontFamily: '-apple-system, BlinkMacSystemFont, Roboto, sans-serif',
          fontSize: '14px',
          fontWeight: '500',
          maxWidth: '90vw',
          boxSizing: 'border-box',
        });

        document.body.appendChild(banner);

        document.getElementById('app-update-btn').addEventListener('click', function () {
          window.location.reload();
        });
        document.getElementById('app-update-dismiss').addEventListener('click', function () {
          banner.remove();
          _bannerShown = false; // allow re-show on next poll cycle
        });
      }

      function checkForUpdate() {
        fetch('flutter_service_worker.js?v=' + Date.now(), {
          cache: 'no-store',
          headers: { 'pragma': 'no-cache', 'cache-control': 'no-cache' }
        })
          .then(function (r) { return r.text(); })
          .then(function (text) {
            var hash = extractHash(text);
            if (_initialHash === null) {
              _initialHash = hash;
            } else if (hash !== _initialHash) {
              showUpdateBanner();
            }
          })
          .catch(function () { /* network error — ignore */ });
      }

      // First check after the page has settled (10 s delay to avoid racing Flutter init)
      setTimeout(checkForUpdate, 10000);
      // Subsequent checks every POLL_INTERVAL_MS
      setInterval(checkForUpdate, POLL_INTERVAL_MS);
    })();
  </script>

  <!-- ── Single-tab enforcement ──────────────────────────────────────────────
       Uses localStorage heartbeat to ensure only one tab loads Flutter (and
       thus Firebase). The check is synchronous on page load — no timing race.
       Duplicate tabs show an overlay WITHOUT ever starting Flutter, preventing
       unnecessary Firestore reads.
  ──────────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      // ── Config ──────────────────────────────────────────────────────────
      var LS_KEY        = 'clm_schedule_active_tab';
      var HEARTBEAT_MS  = 3000;   // write heartbeat every 3 s
      var STALE_MS      = 8000;   // entry is dead if > 8 s old (> 2× heartbeat)

      // ── Helpers ─────────────────────────────────────────────────────────
      var MY_ID = Math.random().toString(36).slice(2) + Date.now();
      var _heartbeatTimer = null;

      function readEntry() {
        try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); }
        catch (e) { return null; }
      }
      function writeEntry() {
        try { localStorage.setItem(LS_KEY, JSON.stringify({ id: MY_ID, ts: Date.now() })); }
        catch (e) {}
      }
      function clearEntry() {
        try {
          var e = readEntry();
          if (e && e.id === MY_ID) localStorage.removeItem(LS_KEY);
        } catch (e) {}
      }
      function isStale(entry) {
        return !entry || (Date.now() - entry.ts > STALE_MS);
      }

      // ── Flutter loader ───────────────────────────────────────────────────
      function loadFlutterApp() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.head.appendChild(s);
      }

      // ── Become the active tab ────────────────────────────────────────────
      function becomeActive() {
        writeEntry();
        _heartbeatTimer = setInterval(writeEntry, HEARTBEAT_MS);
        loadFlutterApp();
      }

      // ── Yield active status ──────────────────────────────────────────────
      function yieldActive() {
        clearInterval(_heartbeatTimer);
        clearEntry();
      }

      // ── Overlay for duplicate tabs ───────────────────────────────────────
      function showDuplicateOverlay() {
        var splash = document.getElementById('splash-screen');
        if (splash) splash.remove();

        var ov = document.createElement('div');
        ov.id = 'clm-dup-overlay';
        Object.assign(ov.style, {
          position: 'fixed', top: '0', left: '0', width: '100%', height: '100%',
          background: 'rgba(10,46,110,0.92)', display: 'flex', alignItems: 'center',
          justifyContent: 'center', zIndex: '9999999',
          fontFamily: '-apple-system, BlinkMacSystemFont, Roboto, sans-serif',
        });

        var card = document.createElement('div');
        Object.assign(card.style, {
          background: '#fff', borderRadius: '16px', padding: '36px 32px',
          maxWidth: '400px', width: '90vw', textAlign: 'center',
          boxShadow: '0 8px 40px rgba(0,0,0,0.35)',
        });
        card.innerHTML =
          '<div style="font-size:44px;margin-bottom:12px">&#128203;</div>' +
          '<h2 style="margin:0 0 10px;color:#0A2E6E;font-size:20px;font-weight:700">Already Open</h2>' +
          '<p style="margin:0 0 24px;color:#555;font-size:14px;line-height:1.5">' +
            'CLM Schedule is already open in another tab.<br>' +
            'Opening multiple tabs wastes data and may cause conflicts.' +
          '</p>' +
          '<button id="clm-dup-switch" style="' +
            'display:block;width:100%;background:#0A2E6E;color:#fff;border:none;' +
            'border-radius:8px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px' +
          '">Switch to existing tab</button>' +
          '<button id="clm-dup-use-this" style="' +
            'display:block;width:100%;background:transparent;color:#0A2E6E;' +
            'border:2px solid #0A2E6E;border-radius:8px;padding:11px;' +
            'font-size:14px;font-weight:600;cursor:pointer' +
          '">Use this tab instead</button>';

        ov.appendChild(card);
        document.body.appendChild(ov);

        document.getElementById('clm-dup-switch').onclick = function () {
          // Close this tab — works when invoked from a user-gesture click.
          // If the browser blocks it (tab opened by typing URL), fall back to
          // replacing the overlay with a plain hint.
          window.close();
          // Give the browser 300ms to close; if we're still here, show hint.
          setTimeout(function () {
            if (!window.closed) {
              ov.innerHTML =
                '<div style="color:#fff;font-size:16px;text-align:center;padding:32px">' +
                  'Switched &#10003;<br><br>' +
                  '<span style="opacity:0.7;font-size:13px">You can close this tab.</span>' +
                '</div>';
              Object.assign(ov.style, { background: '#0A2E6E' });
            }
          }, 300);
        };

        document.getElementById('clm-dup-use-this').onclick = function () {
          ov.remove();
          becomeActive(); // writes heartbeat, sets window.name, loads Flutter
        };
      }

      // ── Main: synchronous check on page load ─────────────────────────────
      var existing = readEntry();
      if (!isStale(existing)) {
        // A fresh heartbeat exists from another tab — this is a duplicate.
        showDuplicateOverlay();
      } else {
        // No active tab found (or its heartbeat is stale) — we become active.
        becomeActive();
      }

      // When this tab is closed/navigated away, release the lock.
      window.addEventListener('beforeunload', function () {
        yieldActive();
      });

      // Edge case: if two tabs open at the exact same millisecond, both pass
      // the stale check. The storage event fires in the tab that lost the race,
      // letting it detect the conflict and show the overlay.
      window.addEventListener('storage', function (e) {
        if (e.key !== LS_KEY) return;
        var entry = readEntry();
        if (entry && entry.id !== MY_ID && !document.getElementById('clm-dup-overlay')) {
          // Another tab just wrote a fresher entry while we thought we were alone.
          // Yield and show overlay.
          yieldActive();
          showDuplicateOverlay();
        }
      });
    })();
  </script>

  <!-- Remove splash screen when Flutter is ready -->
  <script>
    // Cycle loading text to match Flutter widget behavior
    (function() {
      const steps = ['Loading tracks', 'Loading waypoints', 'Updating map'];
      let idx = 0;
      const el = document.querySelector('.splash-status-text');
      if (el) {
        setInterval(function() {
          idx = (idx + 1) % steps.length;
          el.textContent = steps[idx];
        }, 2000);
      }
    })();

    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 400);
      }
    });
    
    // Fallback: remove splash after 5 seconds
    setTimeout(function() {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 400);
      }
    }, 5000);
  </script>
