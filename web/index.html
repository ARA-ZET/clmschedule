  <!-- ── App update notification ────────────────────────────────────────────
       Periodically fetches flutter_service_worker.js (cache-busted) and
       compares its CACHE_NAME hash to the one present on page load.
       When a new build is detected a banner prompts the user to refresh.
  ──────────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      var _initialHash = null;
      var _bannerShown = false;
      var POLL_INTERVAL_MS = 5 * 60 * 1000; // 5 minutes

      function extractHash(text) {
        // Flutter service worker contains: const CACHE_NAME = 'flutter-app-cache-<hash>';
        var m = text.match(/const\s+CACHE_NAME\s*=\s*['"]([^'"]+)['"]/);
        if (m) return m[1];
        // Fallback: hash the whole text length + first 200 chars as fingerprint
        return text.length + '|' + text.slice(0, 200);
      }

      function showUpdateBanner() {
        if (_bannerShown) return;
        _bannerShown = true;

        var banner = document.createElement('div');
        banner.id = 'app-update-banner';
        banner.innerHTML =
          '<span style="flex:1">&#x1F504; A new version of this app is available.</span>' +
          '<button id="app-update-btn" style="' +
            'background:#D4A017;color:#fff;border:none;border-radius:6px;' +
            'padding:8px 18px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap' +
          '">Update now</button>' +
          '<button id="app-update-dismiss" style="' +
            'background:transparent;color:rgba(255,255,255,0.7);border:none;' +
            'cursor:pointer;font-size:18px;padding:0 4px;line-height:1' +
          '">&times;</button>';

        Object.assign(banner.style, {
          position: 'fixed',
          bottom: '20px',
          left: '50%',
          transform: 'translateX(-50%)',
          zIndex: '999999',
          background: '#0A2E6E',
          color: '#fff',
          padding: '12px 16px',
          borderRadius: '10px',
          display: 'flex',
          alignItems: 'center',
          gap: '12px',
          boxShadow: '0 4px 20px rgba(0,0,0,0.4)',
          fontFamily: '-apple-system, BlinkMacSystemFont, Roboto, sans-serif',
          fontSize: '14px',
          fontWeight: '500',
          maxWidth: '90vw',
          boxSizing: 'border-box',
        });

        document.body.appendChild(banner);

        document.getElementById('app-update-btn').addEventListener('click', function () {
          window.location.reload();
        });
        document.getElementById('app-update-dismiss').addEventListener('click', function () {
          banner.remove();
          _bannerShown = false; // allow re-show on next poll cycle
        });
      }

      function checkForUpdate() {
        fetch('flutter_service_worker.js?v=' + Date.now(), {
          cache: 'no-store',
          headers: { 'pragma': 'no-cache', 'cache-control': 'no-cache' }
        })
          .then(function (r) { return r.text(); })
          .then(function (text) {
            var hash = extractHash(text);
            if (_initialHash === null) {
              _initialHash = hash;
            } else if (hash !== _initialHash) {
              showUpdateBanner();
            }
          })
          .catch(function () { /* network error — ignore */ });
      }

      // First check after the page has settled (10 s delay to avoid racing Flutter init)
      setTimeout(checkForUpdate, 10000);
      // Subsequent checks every POLL_INTERVAL_MS
      setInterval(checkForUpdate, POLL_INTERVAL_MS);
    })();
  </script>

  <!-- ── Browser storage health (runs BEFORE Firebase and Flutter) ──────────
       localStorage holds ~5M characters per site. Firebase Auth keeps the
       sign-in token there and Firestore's multi-tab sync keeps tab, query and
       write state there — and Firestore calls setItem with NO try/catch, so
       once it is full every save throws and the Firestore queue can stay
       broken until the page reloads (Nov 2026: Barrie could neither save nor
       sign in). Nothing a user typed lives here: unsaved writes are in
       IndexedDB, so tidying it never loses work.

       What is safe to remove (verified against @firebase/firestore's
       WebStorageSharedClientState): other tabs IGNORE removals of
       firestore_mutations_* and firestore_targets_* keys, but removing a
       firestore_clients_* key tells every other tab that client is gone —
       only done for month-old entries, or in an emergency at boot.

       window.clmStorageCheck(level) is called by lib/services/storage_health
       every few minutes; window.clmStorageBoot is this page-load's report.
  ──────────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      var LIMIT_CHARS  = 5 * 1024 * 1024; // Chrome/Edge/Firefox per-site cap
      var PRESSURE     = 0.5;             // above this, also drop unknown keys
      var WARN         = 0.7;             // above this, the app warns
      var PROBE_KEY    = 'clm_storage_probe';
      var PROBE_CHARS  = 32 * 1024;       // "can still take a sign-in token"
      var INCIDENT_KEY = 'clm_storage_incident'; // uploaded by the app later
      var FIX_FLAG     = 'clm_storage_fix';      // sessionStorage, "Fix now"
      var DAY          = 864e5;

      function store() { try { return window.localStorage; } catch (e) { return null; } }
      function parse(v) { try { return JSON.parse(v); } catch (e) { return null; } }

      function groupOf(k) {
        if (k.indexOf('firebase:authUser:') === 0) return 'firebase_auth';
        if (k.indexOf('firebase:') === 0) return 'firebase_other';
        var m = /^firestore_(clients|mutations|targets|zombie|online_state|sequence_number|bundle_loaded)/.exec(k);
        if (m) return 'firestore_' + m[1];
        if (k.indexOf('clm_') === 0) return 'clm';
        return 'other';
      }

      function keysOf(s) {
        var out = [];
        for (var i = 0; i < s.length; i++) { var k = s.key(i); if (k != null) out.push(k); }
        return out;
      }

      function measure(s) {
        var used = 0, groups = {}, keys = keysOf(s);
        keys.forEach(function (k) {
          var n = k.length + (s.getItem(k) || '').length;
          used += n;
          var g = groups[groupOf(k)] || (groups[groupOf(k)] = { keys: 0, chars: 0 });
          g.keys++; g.chars += n;
        });
        return { usedChars: used, keys: keys.length, groups: groups };
      }

      function canWrite(s) {
        try {
          s.setItem(PROBE_KEY, new Array(PROBE_CHARS + 1).join('x'));
          s.removeItem(PROBE_KEY);
          return true;
        } catch (e) {
          try { s.removeItem(PROBE_KEY); } catch (_) {}
          return false;
        }
      }

      // routine   — entries nothing reads any more (safe while tabs run)
      // pressure  — + keys this app never writes
      // emergency — everything but the sign-in token (boot only)
      function tidy(s, level) {
        var now = Date.now(), removed = 0, freed = 0, keys = keysOf(s);
        var watched = {};
        keys.forEach(function (k) {
          if (k.indexOf('firestore_clients_') !== 0) return;
          var c = parse(s.getItem(k));
          if (c && c.activeTargetIds && c.activeTargetIds.forEach) {
            c.activeTargetIds.forEach(function (t) { watched[String(t)] = true; });
          }
        });
        function drop(k) {
          var v = s.getItem(k);
          freed += k.length + (v ? v.length : 0); removed++;
          s.removeItem(k);
        }
        keys.forEach(function (k) {
          var v, m;
          if (level === 'emergency') {
            if (k.indexOf('firebase:authUser:') !== 0 && k !== INCIDENT_KEY) drop(k);
          } else if (k.indexOf('firestore_mutations_') === 0) {
            // Other tabs read a write's entry only as it is written. A
            // finished one (acknowledged/rejected) should already be gone; a
            // pending one older than 10 minutes was long since seen.
            v = parse(s.getItem(k));
            if (!v || v.state !== 'pending' || !(now - (v.updateTimeMs || 0) < 6e5)) drop(k);
          } else if ((m = /^firestore_targets_.*_(\d+)$/.exec(k))) {
            // No tab listens to it any more, or the server refused it. The
            // SDK never removes a refused query's entry (it keeps the whole
            // error text, ~500 chars) — the Nov 2026 leak: one per failed
            // query, 11,469 of them on Barrie's PC.
            v = parse(s.getItem(k));
            if (!watched[m[1]] || !v || v.state === 'rejected') drop(k);
          } else if (k.indexOf('firestore_clients_') === 0) {
            v = parse(s.getItem(k));
            if (now - ((v && v.updateTimeMs) || 0) > 30 * DAY) drop(k);
          } else if (level === 'pressure' && groupOf(k) === 'other') {
            drop(k);
          }
        });
        return { removed: removed, freedChars: freed };
      }

      // allowEmergency: only at boot, before this tab's Firebase starts.
      function check(level, allowEmergency, force) {
        var s = store();
        if (!s) return { available: false };
        var before, result = { available: true, limitChars: LIMIT_CHARS };
        try {
          before = measure(s);
          var lvl = level || 'routine';
          if (lvl === 'routine' && before.usedChars > LIMIT_CHARS * PRESSURE) lvl = 'pressure';
          var t = tidy(s, lvl), removed = t.removed, freed = t.freedChars;
          var ok = canWrite(s);
          if (!ok && lvl === 'routine') {
            lvl = 'pressure';
            t = tidy(s, lvl); removed += t.removed; freed += t.freedChars;
            ok = canWrite(s);
          }
          if (allowEmergency && (!ok || (force && measure(s).usedChars > LIMIT_CHARS * WARN))) {
            lvl = 'emergency';
            t = tidy(s, lvl); removed += t.removed; freed += t.freedChars;
            ok = canWrite(s);
            if (!ok) { s.clear(); lvl = 'cleared'; ok = canWrite(s); }
          }
          var after = measure(s);
          result.level = lvl;
          result.removed = removed;
          result.freedChars = freed;
          result.beforeUsedChars = before.usedChars;
          result.usedChars = after.usedChars;
          result.keys = after.keys;
          result.groups = after.groups;
          result.canWrite = ok;

          // Remember what filled it, so the app can report it once signed in.
          if (allowEmergency && (force || lvl === 'emergency' || lvl === 'cleared' ||
              before.usedChars > LIMIT_CHARS * PRESSURE)) {
            try {
              s.setItem(INCIDENT_KEY, JSON.stringify({
                at: Date.now(), level: lvl, forced: !!force,
                before: before, afterUsedChars: after.usedChars,
                removed: removed, canWrite: ok,
                userAgent: navigator.userAgent
              }));
            } catch (e) {}
          }
          if (removed) {
            console.warn('[storage] tidied localStorage (' + lvl + '): removed ' + removed +
              ' keys, ' + Math.round(freed / 1024) + 'K chars', before.groups);
          }
        } catch (e) {
          result.canWrite = false;
          result.error = String(e);
        }
        return result;
      }

      var force = false;
      try {
        force = sessionStorage.getItem(FIX_FLAG) === '1';
        sessionStorage.removeItem(FIX_FLAG);
      } catch (e) {}
      window.clmStorageBoot = JSON.stringify(check(force ? 'pressure' : 'routine', true, force));
      window.clmStorageCheck = function (level) {
        return JSON.stringify(check(level, false, false));
      };
    })();
  </script>

  <!-- ── Single-tab enforcement (per URL, maps build only) ──────────────────
       Uses a localStorage heartbeat so the SAME page isn't loaded twice (which
       would double the Firestore reads). The check is synchronous on page load
       — no timing race. Duplicate tabs show an overlay WITHOUT ever starting
       Flutter.

       Off for CLM Schedule: main.dart uses Firestore's multi-tab persistence,
       so extra tabs share one cache and one set of listeners instead of
       re-reading. The maps build has no persistence, so deploy_maps.sh flips
       SINGLE_TAB on for it.

       The lock is keyed by the current route, not by the origin: on the maps
       flavor /map/{shareCode} and /admin/map?doc=..&month=.. are different
       maps and are meant to be open side by side (see openInNewTab in
       lib/shareable_maps/utils/url_updater_web.dart). Only two tabs showing
       the same map collide.
  ──────────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      // ── Config ──────────────────────────────────────────────────────────
      var SINGLE_TAB    = false;   // deploy_maps.sh rewrites this to true
      var LS_PREFIX     = 'clm_active_tab:';           // + route key
      var LEGACY_LS_KEY = 'clm_schedule_active_tab';   // pre-route-scoped lock
      var HEARTBEAT_MS  = 3000;   // write heartbeat every 3 s
      var STALE_MS      = 8000;   // entry is dead if > 8 s old (> 2× heartbeat)
      // Query params that identify WHICH document is open. Anything else
      // (utm_*, print flags, …) is ignored so it can't split the lock.
      var IDENT_PARAMS  = ['doc', 'month', 'map', 'code', 'share'];

      // ── Helpers ─────────────────────────────────────────────────────────
      var MY_ID = Math.random().toString(36).slice(2) + Date.now();
      var _heartbeatTimer = null;
      var _claimedRoute = null;

      // Identity of the page this tab is showing, e.g. '/map/x7Kp2mNq',
      // '/admin/map?doc=abc&month=2026-08' or '/' for the gallery.
      function routeKey() {
        var path = (window.location.pathname || '/').replace(/\/+$/, '');
        if (!path) path = '/';
        var ident = [];
        try {
          var params = new URLSearchParams(window.location.search || '');
          for (var i = 0; i < IDENT_PARAMS.length; i++) {
            var v = params.get(IDENT_PARAMS[i]);
            if (v) ident.push(IDENT_PARAMS[i] + '=' + v);
          }
        } catch (e) {}
        return ident.length ? path + '?' + ident.join('&') : path;
      }

      function lsKey(route) { return LS_PREFIX + route; }

      function readEntry(route) {
        try { return JSON.parse(localStorage.getItem(lsKey(route)) || 'null'); }
        catch (e) { return null; }
      }
      function writeEntry(route) {
        try {
          localStorage.setItem(lsKey(route), JSON.stringify({ id: MY_ID, ts: Date.now() }));
        } catch (e) {}
      }
      function clearEntry(route) {
        if (!route) return;
        try {
          var e = readEntry(route);
          if (e && e.id === MY_ID) localStorage.removeItem(lsKey(route));
        } catch (e) {}
      }
      function isStale(entry) {
        return !entry || (Date.now() - entry.ts > STALE_MS);
      }

      // ── Flutter loader ───────────────────────────────────────────────────
      function loadFlutterApp() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.head.appendChild(s);
      }

      // ── Become the active tab ────────────────────────────────────────────
      function becomeActive() {
        _claimedRoute = routeKey();
        writeEntry(_claimedRoute);
        _heartbeatTimer = setInterval(beat, HEARTBEAT_MS);
        loadFlutterApp();
      }

      // Heartbeat. The app rewrites the address bar as the user opens maps
      // (replaceState in url_updater_web.dart), so re-check the route each
      // tick: hand back the old lock and claim the new one. This never blocks
      // — navigating inside a tab is not a duplicate.
      function beat() {
        var route = routeKey();
        if (route !== _claimedRoute) {
          clearEntry(_claimedRoute);
          _claimedRoute = route;
        }
        writeEntry(_claimedRoute);
      }

      // ── Yield active status ──────────────────────────────────────────────
      function yieldActive() {
        clearInterval(_heartbeatTimer);
        clearEntry(_claimedRoute);
      }

      // ── Overlay for duplicate tabs ───────────────────────────────────────
      function showDuplicateOverlay() {
        var splash = document.getElementById('splash-screen');
        if (splash) splash.remove();

        var ov = document.createElement('div');
        ov.id = 'clm-dup-overlay';
        Object.assign(ov.style, {
          position: 'fixed', top: '0', left: '0', width: '100%', height: '100%',
          background: 'rgba(10,46,110,0.92)', display: 'flex', alignItems: 'center',
          justifyContent: 'center', zIndex: '9999999',
          fontFamily: '-apple-system, BlinkMacSystemFont, Roboto, sans-serif',
        });

        var card = document.createElement('div');
        Object.assign(card.style, {
          background: '#fff', borderRadius: '16px', padding: '36px 32px',
          maxWidth: '400px', width: '90vw', textAlign: 'center',
          boxShadow: '0 8px 40px rgba(0,0,0,0.35)',
        });
        // Title is rebranded per flavor at deploy time (deploy_maps.sh), so
        // derive the app name from it instead of hard-coding "CLM Schedule".
        var appName = (document.title || 'This app').replace(/[<>&]/g, '');

        card.innerHTML =
          '<div style="font-size:44px;margin-bottom:12px">&#128203;</div>' +
          '<h2 style="margin:0 0 10px;color:#0A2E6E;font-size:20px;font-weight:700">Already Open</h2>' +
          '<p style="margin:0 0 24px;color:#555;font-size:14px;line-height:1.5">' +
            'This page is already open in another ' + appName + ' tab.<br>' +
            'Loading it twice wastes data and may cause conflicts.' +
          '</p>' +
          '<button id="clm-dup-switch" style="' +
            'display:block;width:100%;background:#0A2E6E;color:#fff;border:none;' +
            'border-radius:8px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px' +
          '">Switch to existing tab</button>' +
          '<button id="clm-dup-use-this" style="' +
            'display:block;width:100%;background:transparent;color:#0A2E6E;' +
            'border:2px solid #0A2E6E;border-radius:8px;padding:11px;' +
            'font-size:14px;font-weight:600;cursor:pointer' +
          '">Use this tab instead</button>';

        ov.appendChild(card);
        document.body.appendChild(ov);

        document.getElementById('clm-dup-switch').onclick = function () {
          // Close this tab — works when invoked from a user-gesture click.
          // If the browser blocks it (tab opened by typing URL), fall back to
          // replacing the overlay with a plain hint.
          window.close();
          // Give the browser 300ms to close; if we're still here, show hint.
          setTimeout(function () {
            if (!window.closed) {
              ov.innerHTML =
                '<div style="color:#fff;font-size:16px;text-align:center;padding:32px">' +
                  'Switched &#10003;<br><br>' +
                  '<span style="opacity:0.7;font-size:13px">You can close this tab.</span>' +
                '</div>';
              Object.assign(ov.style, { background: '#0A2E6E' });
            }
          }, 300);
        };

        document.getElementById('clm-dup-use-this').onclick = function () {
          ov.remove();
          becomeActive(); // writes heartbeat, sets window.name, loads Flutter
        };
      }

      // ── Main: synchronous check on page load ─────────────────────────────
      // Drop the old origin-wide lock left by pre-route-scoped builds — it
      // would otherwise flag every map link as a duplicate.
      try { localStorage.removeItem(LEGACY_LS_KEY); } catch (e) {}

      // Sweep locks left behind by tabs that were killed without unloading, so
      // one key per visited map doesn't pile up in localStorage.
      try {
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i);
          if (!k || k.indexOf(LS_PREFIX) !== 0) continue;
          if (isStale(readEntry(k.slice(LS_PREFIX.length)))) localStorage.removeItem(k);
        }
      } catch (e) {}

      if (!SINGLE_TAB) {
        // Multi-tab allowed — boot straight away, no lock or heartbeat.
        loadFlutterApp();
        return;
      }

      var existing = readEntry(routeKey());
      if (!isStale(existing)) {
        // A fresh heartbeat exists for THIS route in another tab — duplicate.
        showDuplicateOverlay();
      } else {
        // Nobody holds this route (or its heartbeat is stale) — take it.
        becomeActive();
      }

      // When this tab is closed/navigated away, release the lock.
      window.addEventListener('beforeunload', function () {
        yieldActive();
      });

      // Edge case: if two tabs open at the exact same millisecond, both pass
      // the stale check. The storage event fires in the tab that lost the race,
      // letting it detect the conflict and show the overlay.
      window.addEventListener('storage', function (e) {
        if (!_claimedRoute || e.key !== lsKey(_claimedRoute)) return;
        var entry = readEntry(_claimedRoute);
        if (entry && entry.id !== MY_ID && !document.getElementById('clm-dup-overlay')) {
          // Another tab just wrote a fresher entry while we thought we were alone.
          // Yield and show overlay.
          yieldActive();
          showDuplicateOverlay();
        }
      });
    })();
  </script>

  <!-- Remove splash screen when Flutter is ready -->
  <script>
    // Cycle loading text to match Flutter widget behavior
    (function() {
      const steps = ['Loading tracks', 'Loading waypoints', 'Updating map'];
      let idx = 0;
      const el = document.querySelector('.splash-status-text');
      if (el) {
        setInterval(function() {
          idx = (idx + 1) % steps.length;
          el.textContent = steps[idx];
        }, 2000);
      }
    })();

    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 400);
      }
    });
    
    // Fallback only — the in-app splash (ClmMapsSplash) looks identical, so
    // flutter-first-frame hands over seamlessly. A short timeout here used to
    // pull the splash while Flutter was still booting, leaving a bare screen.
    setTimeout(function() {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 400);
      }
    }, 30000);
  </script>
