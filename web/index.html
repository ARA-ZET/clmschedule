<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CLM Schedule - Enterprise scheduling application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CLM Schedule">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <title>CLM Schedule</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Splash Screen Styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0175C2 0%, #0a9fdb 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    
    #splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    .splash-logo {
      width: 150px;
      height: 150px;
      margin-bottom: 30px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .splash-title {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    
    .splash-loading {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
  
  <!-- Google Sign-In Configuration -->
  <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
  
  <!-- Polyfill for Firebase Firestore web compatibility -->
  <script>
    if (typeof global === 'undefined') {
      window.global = window;
    }
  </script>
  
  <!-- Google Maps Configuration -->
  <script src="maps_config.js"></script>
  <!-- Google Maps JavaScript API -->
  <script>
    // Load Google Maps API with key from maps_config.js
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${window.GOOGLE_MAPS_API_KEY}&libraries=places`;
    script.defer = true;
    script.async = true;
    script.onerror = function() {
      console.error('Failed to load Google Maps API');
    };
    document.head.appendChild(script);
  </script>
  <script src="places_helper.js" defer></script>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <img src="icons/Icon-512.png" alt="CLM Schedule" class="splash-logo">
    <div class="splash-title">CLM Schedule</div>
    <div class="splash-loading"></div>
  </div>
 
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Remove splash screen when Flutter is ready -->
  <script>
    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 500);
      }
    });
    
    // Fallback: remove splash after 3 seconds if Flutter event doesn't fire
    setTimeout(function() {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 500);
      }
    }, 3000);
  </script>
  
</body>
</html>
